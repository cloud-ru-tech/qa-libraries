name: Security

on:
  workflow_call:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

env:
  UV_NO_PROGRESS: '1'
  UV_PYTHON_DOWNLOADS: never

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.14'
          enable-cache: false
      - run: make sync audit PYTHON_VERSION="${PYTHON_VERSION}" AUDIT_ARGS="${AUDIT_ARGS}"
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          AUDIT_ARGS: --cache-dir ${{ runner.temp }}/pip-audit --format json --output pip-audit.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: pip-audit-${{ matrix.python }}
          path: pip-audit.json
          if-no-files-found: error
          retention-days: 7

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          output: sarif
          upload: never
      - run: python -m scripts.security sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always() && hashFiles('sarif/*.sarif') != '' && (github.event_name == 'pull_request' || github.actor != 'dependabot[bot]')
        with:
          sarif_file: sarif
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: codeql-sarif
          path: sarif/*.sarif
          if-no-files-found: error
          retention-days: 7
