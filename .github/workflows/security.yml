name: Security

on:
  workflow_call:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

env:
  UV_NO_PROGRESS: '1'
  UV_PYTHON_DOWNLOADS: never

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.14'
          enable-cache: false
      - run: make sync audit PYTHON_VERSION="${PYTHON_VERSION}" AUDIT_ARGS="${AUDIT_ARGS}"
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          AUDIT_ARGS: --cache-dir ${{ runner.temp }}/pip-audit --format json --output pip-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pip-audit-${{ matrix.python }}
          path: pip-audit.json
          if-no-files-found: error
          retention-days: 7

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          output: sarif
          upload: never
      - run: python -m scripts.security sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always() && hashFiles('sarif/*.sarif') != '' && (github.event_name == 'pull_request' || github.actor != 'dependabot[bot]')
        with:
          sarif_file: sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-sarif
          path: sarif/*.sarif
          if-no-files-found: error
          retention-days: 7
