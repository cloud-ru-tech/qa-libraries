[project]
description = "Асинхронный клиент для серверов MCP"
readme = "README.md"
authors = [
    { name = "Andrew Fernatiy", email = "akfernatii@cloud.ru" },
]
dependencies = [
    "mcp[cli]>=1.25.0,<2",
    "httpx>=0.28.1,<0.29",
    "anyio>=4.16.0,<5",
    "pydantic>=2.9.2,<3",
    "tenacity>=9.1.2,<10",
    "cloudru-qa-http-client>=1.0.0,<2",
    "cloudru-qa-http-client-structlog>=1.0.0,<2",
    "cloudru-qa-http-client-responses>=1.0.0,<2",
    "cloudru-qa-http-client-retries>=1.0.0,<2",
]
name = "cloudru-qa-mcp-client"
version = "1.0.0"
license = "Apache-2.0"
requires-python = ">=3.13"
license-files = [
    "LICENSE",
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/cloud-ru-tech/qa-libraries"
Issues = "https://github.com/cloud-ru-tech/qa-libraries/issues"

[project.optional-dependencies]
structlog = [
    "structlog>=26.1.0",
]

[build-system]
requires = [
    "hatchling>=1.31.0,<2",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "mcp_client",
]

[tool.hatch.build.targets.sdist]
include = [
    "/mcp_client",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = "--strict-markers --strict-config"
filterwarnings = [
    "error",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
