[project]
name = "cloudru-qa-grpc-client-structlog"
version = "1.0.0"
description = "Структурированные логи для gRPC-клиента"
authors = [
    { name = "Алексей Кирютин", email = "ayukiryutin@cloud.ru" },
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cloudru-qa-grpc-client>=1.0.0,<2",
    "structlog>=26.1.0",
]
license = "Apache-2.0"
license-files = [
    "LICENSE",
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/cloud-ru-tech/qa-libraries"
Issues = "https://github.com/cloud-ru-tech/qa-libraries/issues"

[build-system]
requires = [
    "hatchling>=1.31.0,<2",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "grpc_client_structlog",
]

[tool.hatch.build.targets.wheel.force-include]
".agents/skills" = "grpc_client_structlog/.agents/skills"

[tool.hatch.build.targets.sdist]
include = [
    "/grpc_client_structlog",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.hatch.build.targets.sdist.force-include]
".agents/skills" = ".agents/skills"

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 180
testpaths = [
    "tests",
]
addopts = "--strict-markers --strict-config"
filterwarnings = [
    "error",
]
asyncio_default_fixture_loop_scope = "function"
