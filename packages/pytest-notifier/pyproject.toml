[project]
name = "cloudru-qa-pytest-notifier"
version = "1.0.0"
description = "Pytest-плагин для уведомлений о результатах прогона тестов"
authors = [
    { name = "Алексей Кирютин", email = "ayukiryutin@cloud.ru" },
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27.0,<0.29",
    "pydantic>=2.7.0,<3",
    "pydantic-settings>=2.6.0,<3",
    "pytest>=7.0,<10",
    "rich>=14.2.0,<16",
]
license = "Apache-2.0"
license-files = [
    "LICENSE",
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Pytest",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/cloud-ru-tech/qa-libraries"
Issues = "https://github.com/cloud-ru-tech/qa-libraries/issues"

[project.entry-points.pytest11]
pytest_notifier = "pytest_notifier.plugin"

[build-system]
requires = [
    "hatchling>=1.33.0,<2",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "pytest_notifier",
]

[tool.hatch.build.targets.sdist]
include = [
    "/pytest_notifier",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "tests",
]
addopts = "--strict-markers --strict-config"
filterwarnings = [
    "error",
]
