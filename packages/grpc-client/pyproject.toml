[project]
name = "cloudru-qa-grpc-client"
version = "1.0.0"
description = "Базовый gRPC-клиент"
authors = [
    { name = "Алексей Кирютин", email = "ayukiryutin@cloud.ru" },
]
readme = "README.md"
license = "Apache-2.0"
license-files = [
    "LICENSE",
]
requires-python = ">=3.13"
keywords = [
    "grpc",
    "grpcio",
    "client",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "glom>=24.11.0",
    "grpcio>=1.84.0,<2",
    "grpcio-status>=1.84.0,<2",
    "protobuf>=5.29.0,<8",
]

[project.urls]
Repository = "https://github.com/cloud-ru-tech/qa-libraries"
Issues = "https://github.com/cloud-ru-tech/qa-libraries/issues"

[project.optional-dependencies]
codegen = [
    "grpcio-tools>=1.71.0,<2",
]

[build-system]
requires = [
    "hatchling>=1.31.0,<2",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "grpc_client",
]

[tool.hatch.build.targets.wheel.force-include]
".agents/skills" = "grpc_client/.agents/skills"

[tool.hatch.build.targets.sdist]
include = [
    "/grpc_client",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/proto",
    "/gen-test-api.sh",
]

[tool.hatch.build.targets.sdist.force-include]
".agents/skills" = ".agents/skills"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
testpaths = [
    "tests",
]
addopts = "--strict-markers --strict-config"
filterwarnings = [
    "error",
]
pythonpath = [
    "api",
]
