[project]
name = "cloudru-qa-http-client-auth"
version = "1.0.0"
description = "Авторизация для HTTP-клиента"
authors = [
    { name = "Алексей Кирютин", email = "ayukiryutin@cloud.ru" },
]
readme = "README.md"
license = "Apache-2.0"
license-files = [
    "LICENSE",
]
requires-python = ">=3.13"
keywords = [
    "http",
    "httpx",
    "client",
    "auth",
    "iam",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "cloudru-qa-http-client>=1.0.0,<2",
    "httpx>=0.28.1,<0.29",
]

[project.urls]
Repository = "https://github.com/cloud-ru-tech/qa-libraries"
Issues = "https://github.com/cloud-ru-tech/qa-libraries/issues"

[build-system]
requires = [
    "hatchling>=1.31.0,<2",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "http_client_auth",
]

[tool.hatch.build.targets.wheel.force-include]
".agents/skills" = "http_client_auth/.agents/skills"

[tool.hatch.build.targets.sdist]
include = [
    "/http_client_auth",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.hatch.build.targets.sdist.force-include]
".agents/skills" = ".agents/skills"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = [
    "tests",
]
filterwarnings = [
    "error",
]
