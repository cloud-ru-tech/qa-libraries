services:
  httpbin:
    image: mccutchen/go-httpbin:latest
    container_name: http-client-httpbin
    ports:
      - "8080:8080"
    environment:
      # Maximum /delay/N and /drip duration defaults to 10s; the demo stays within this limit
      MAX_DURATION: 15s
      MAX_BODY_SIZE: 10485760
    healthcheck:
      test: ["CMD", "/bin/go-httpbin", "-help"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
