[project]
name = "http-client-allure-examples"
version = "0.0.0"
description = "Демонстрационные тесты для опций интеграции HTTP клиента с Allure"
requires-python = ">=3.13"
dependencies = [
    "allure-pytest>=2.16.0",
    "assertpy>=1.1",
    "cloudru-qa-http-client-allure>=1.0.0,<2",
    "cloudru-qa-http-client-retries>=1.0.0,<2",
    "pytest-docker>=3.0.0,<4",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.0",
]

[tool.uv]
package = false

[tool.uv.sources.cloudru-qa-http-client-allure]
path = ".."
editable = true

[tool.uv.sources.cloudru-qa-http-client-retries]
path = "../../http-client-retries"
editable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "tests",
]
