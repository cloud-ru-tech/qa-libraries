[project]
description = "Простой SSH-клиент для автотестов"
readme = "README.md"
authors = [
    { name = "akfernatii", email = "akfernatii@cloud.ru" },
]
dependencies = [
    "paramiko>=5.1.0,<5.2",
    "asyncssh>=2.14.0,<3",
]
name = "cloudru-qa-ssh-client"
version = "1.0.0"
license = "Apache-2.0"
requires-python = ">=3.13"
license-files = [
    "LICENSE",
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/cloud-ru-tech/qa-libraries"
Issues = "https://github.com/cloud-ru-tech/qa-libraries/issues"

[project.optional-dependencies]
structlog = [
    "structlog>=26.1.0",
]

[build-system]
requires = [
    "hatchling>=1.33.0,<2",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "ssh_client",
]

[tool.hatch.build.targets.sdist]
include = [
    "/ssh_client",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = "--strict-markers --strict-config"
filterwarnings = [
    "error",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
